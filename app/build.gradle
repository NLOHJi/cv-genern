plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.rw.cvstudio'
    compileSdk 34

    defaultConfig {
        applicationId "com.rw.cvstudio"
        minSdk 24
        targetSdk 34
        versionCode 11 // CHANGE THIS FOR EVERY NEW BUILD
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.resourceinspection:resourceinspection-annotation:1.0.1'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.resourceinspection:resourceinspection-annotation:1.0.1'
    }
}